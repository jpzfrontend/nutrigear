<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>NutriGear - Suplementos y Accesorios Deportivos</title>
        <link rel="stylesheet" href="css/styles.css">
    </head>
<body>

    <header>
        <div class="logo">NutriGear</div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="blog.html">Blog</a></li>

            </ul>
        </nav>
        <a href="carrito.html" class="carrito">🛒 Carrito</a>        
    </header>

    <main>
     <section class="formulario">
        <h1>Contáctanos</h1>
        <form action="#" method="post">
         <label for="nombre">Nombre</label>
         <input type="text" id="nombre" name="nombre" required>
         <span class="error-message" id="error-nombre"></span>

         <label for="correo">Correo electrónico</label>
         <input type="email" id="correo" name="correo" required>
         <span class="error-message" id="error-correo"></span>

         <label for="comentario">Comentario</label>
         <textarea id="comentario" name="comentario" rows="5" required></textarea>
         <span class="error-message" id="error-comentario"></span>

         <button type="submit">Enviar</button>
        </form>
     </section>
    </main>

    <footer>
        <p>&copy; 2026 NutriGear. Todos los derechos reservados.</p>
    </footer>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NutriGear Admin - Nuevo Producto</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div class="admin-layout">
    <nav class="admin-menu">
      <div class="logo">NutriGear Admin</div>
      <ul>
        <li><a href="admin-home.html">Inicio</a></li>
        <li><a href="admin-productos.html">Productos</a></li>
        <li><a href="admin-usuarios.html">Usuarios</a></li>
        <li><a href="index.html">Salir a la tienda</a></li>
      </ul>
    </nav>
    <main class="admin-contenido">
      <h1>Nuevo Producto</h1>
      <form id="form-producto" class="formulario">
        <label for="codigo">Código producto</label>
        <input type="text" id="codigo" name="codigo" minlength="3" required>
        <span class="error-message" id="error-codigo"></span>

        <label for="nombreProd">Nombre</label>
        <input type="text" id="nombreProd" name="nombreProd" maxlength="100" required>
        <span class="error-message" id="error-nombreProd"></span>

        <label for="descripcion">Descripción</label>
        <textarea id="descripcion" name="descripcion" maxlength="500"></textarea>

        <label for="precio">Precio</label>
        <input type="number" id="precio" name="precio" min="0" step="0.01" required>
        <span class="error-message" id="error-precio"></span>

        <label for="stock">Stock</label>
        <input type="number" id="stock" name="stock" min="0" step="1" required>
        <span class="error-message" id="error-stock"></span>

        <label for="stockCritico">Stock crítico</label>
        <input type="number" id="stockCritico" name="stockCritico" min="0" step="1">

        <label for="categoria">Categoría</label>
        <select id="categoria" name="categoria" required>
          <option value="">Seleccione...</option>
          <option value="Proteínas">Proteínas</option>
          <option value="Creatina">Creatina</option>
          <option value="Pre-entrenos">Pre-entrenos</option>
          <option value="Aminoácidos">Aminoácidos</option>
          <option value="Vitaminas">Vitaminas</option>
          <option value="Accesorios">Accesorios</option>
        </select>

        <label for="imagen">Imagen</label>
        <input type="file" id="imagen" name="imagen">

        <button type="submit">Guardar Producto</button>
      </form>
    </main>
  </div>
  <script src="js/script.js"></script>
  <script src="js/admin-producto-form.js"></script>
</body>
</html>

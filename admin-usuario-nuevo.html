<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NutriGear Admin - Nuevo Usuario</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div class="admin-layout">
    <nav class="admin-menu">
      <div class="logo">NutriGear Admin</div>
      <ul>
        <li><a href="admin-home.html">Inicio</a></li>
        <li><a href="admin-productos.html">Productos</a></li>
        <li><a href="admin-usuarios.html">Usuarios</a></li>
        <li><a href="index.html">Salir a la tienda</a></li>
      </ul>
    </nav>
    <main class="admin-contenido">
      <h1>Nuevo Usuario</h1>
      <form id="form-usuario" class="formulario">
        <label for="run">RUN</label>
        <input type="text" id="run" name="run" required>
        <span class="error-message" id="error-run"></span>

        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre" maxlength="50" required>
        <span class="error-message" id="error-nombre"></span>

        <label for="apellidos">Apellidos</label>
        <input type="text" id="apellidos" name="apellidos" maxlength="100" required>
        <span class="error-message" id="error-apellidos"></span>

        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo" name="correo" maxlength="100" required>
        <span class="error-message" id="error-correo"></span>

        <label for="fechaNacimiento">Fecha de nacimiento</label>
        <input type="date" id="fechaNacimiento" name="fechaNacimiento">

        <label for="tipoUsuario">Tipo de usuario</label>
        <select id="tipoUsuario" name="tipoUsuario" required>
          <option value="">Seleccione...</option>
          <option value="Administrador">Administrador</option>
          <option value="Vendedor">Vendedor</option>
          <option value="Cliente">Cliente</option>
        </select>

        <label for="direccion">Dirección</label>
        <input type="text" id="direccion" name="direccion" maxlength="300" required>
        <span class="error-message" id="error-direccion"></span>

        <button type="submit">Guardar Usuario</button>
      </form>
    </main>
  </div>

  <script src="js/script.js"></script>
  <script src="js/admin-usuario-form.js"></script>
</body>
</html>
